[experiment]
suite = "synthetic_erm"
# Calibration-only seeds. Pilot and production configurations must use
# disjoint seeds so tolerance selection cannot adapt to reported instances.
seeds = [100, 101]
warmups = 0
repetitions = 1
timeout_seconds = 900
startup_timeout_seconds = 900

[calibration]
candidates = [1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7, 1.0e-8, 1.0e-9, 1.0e-10]

# Common external targets used to qualify every native tolerance candidate.
# Keep calibrated=false until these thresholds and all selected native
# tolerances have been reviewed and frozen.
[accuracy]
stationarity = 1.0e-6
feasibility = 1.0e-6
relative_duality_gap = 1.0e-6
calibrated = false

[multinomial]
n_classes = 5
teacher_scale = 1.0
box_lower = -1.0
box_upper = 1.0
shapes = [
  { n = 256, p = 32 },
  { n = 1024, p = 64 },
  { n = 4096, p = 256 },
]

[multinomial.solvers]
cpu = ["rlaopt_sapphire", "projected_gradient", "jaxopt_lbfgsb"]
cuda = ["rlaopt_sapphire", "projected_gradient", "jaxopt_lbfgsb"]

[multinomial.execution]
max_iterations = 10000
batch_size = 256

[elastic_net]
teacher_density = 0.1
noise_ratio = 0.1
teacher_intercept = 0.5
regularization_fractions = [0.1, 0.01]
shapes = [
  { n = 256, p = 32 },
  { n = 1024, p = 64 },
  { n = 4096, p = 256 },
]

[elastic_net.vanilla_solvers]
cpu = ["rlaopt_sapphire", "sklearn_coordinate_descent", "jaxopt_proximal_gradient"]
cuda = ["rlaopt_sapphire", "cuml_coordinate_descent", "jaxopt_proximal_gradient"]

[elastic_net.vanilla_execution]
max_iterations = 10000
batch_size = 256

[elastic_net.bounded_solvers]
cpu = ["rlaopt_admm", "scs", "clarabel_qdldl"]
cuda = ["rlaopt_admm", "scs_cuda", "cuclarabel_cudss"]

[elastic_net.bounded_execution]
max_iterations = 10000
batch_size = 256

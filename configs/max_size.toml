[experiment]
alphas = [1.0]
lambdas = [0.0001]
seeds = [0]
kkt_tolerance = 1.0e-6
timeout_seconds = 300
nystrom_rank = 128
warmups = 0
repetitions = 1

[[experiment.shapes]]
n = 65536
p = 65536
family = "square"

[backends.cpu]
solvers = ["rlaopt_nystrom_pcg", "rlaopt_cg", "scipy_lsqr", "torch_qr"]

[backends.cuda]
solvers = ["rlaopt_nystrom_pcg", "rlaopt_cg", "cuml_lsmr", "torch_qr"]

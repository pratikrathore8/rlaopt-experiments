# Post-production SCS GPU-direct tolerance sensitivity; not held-out calibration.
# Other family settings preserve the source protocol but are excluded by solver_subset.
[experiment]
suite = "real_erm"
# Restrict this follow-up to SCS GPU-direct.
solver_subset = ["scs_cuda_direct"]
# This cluster path is node-local and must be prepared on every execution node.
data_root = "/scr/pratikr/rlaopt-real-data"
# The time-constrained production study uses one fixed solver seed and one timing
# observation per configuration.
seeds = [300]
warmups = 0
repetitions = 1
timeout_seconds = 3600
startup_timeout_seconds = 1800

[accuracy]
stationarity = 1.0e-4
feasibility = 1.0e-6
calibrated = true

[multinomial]
datasets = ["cifar10", "rcv1", "svhn", "news20", "fashion_mnist"]
box_lower = -1.0
box_upper = 1.0

[multinomial.solvers]
cpu = [
  "rlaopt_sapphire",
  "projected_gradient",
  "projected_gradient_no_jit",
  "jaxopt_lbfgsb",
  "jaxopt_lbfgsb_no_jit",
]
cuda = [
  "rlaopt_sapphire",
  "projected_gradient",
  "projected_gradient_no_jit",
  "jaxopt_lbfgsb",
  "jaxopt_lbfgsb_no_jit",
]

[multinomial.execution]
max_iterations = 100000
batch_size = 256

[multinomial.execution.native_tolerances_calibrated]
cpu = true
cuda = true

[multinomial.execution.native_tolerances.cpu]
# JIT changes execution of the same JAXopt loop, not its native stopping rule.
rlaopt_sapphire = 1.0e-7
projected_gradient = 1.0e-6
projected_gradient_no_jit = 1.0e-6
jaxopt_lbfgsb = 1.0e-6
jaxopt_lbfgsb_no_jit = 1.0e-6

[multinomial.execution.native_tolerances.cuda]
rlaopt_sapphire = 1.0e-7
projected_gradient = 1.0e-6
projected_gradient_no_jit = 1.0e-6
jaxopt_lbfgsb = 1.0e-6
jaxopt_lbfgsb_no_jit = 1.0e-6

[elastic_net]
datasets = ["yearpredictionmsd"]
regularization_fractions = [0.1]

[elastic_net.bounded_solvers]
cpu = ["scs_cpu_indirect"]
cuda = ["scs_cuda_direct"]

[elastic_net.bounded_execution]
max_iterations = 100000
batch_size = 256
native_tolerance_source = "Post-production tolerance sensitivity on YearPredictionMSD-rf: eps_abs=eps_rel=1e-8, specified before follow-up runs after the GPU-direct 1e-7 native success missed external accuracy. Not held-out calibration; original results retained separately."

[elastic_net.bounded_execution.native_tolerances_calibrated]
cpu = false
cuda = false

[elastic_net.bounded_execution.native_tolerances.cpu]
scs_cpu_indirect = 1.0e-7

[elastic_net.bounded_execution.native_tolerances.cuda]
scs_cuda_direct = 1.0e-8

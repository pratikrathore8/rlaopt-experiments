[experiment]
suite = "synthetic_erm"
# Held-out from smoke seeds 0-2 and calibration seeds 100-101.
seeds = [200]
warmups = 1
repetitions = 1
timeout_seconds = 900
startup_timeout_seconds = 900

[accuracy]
stationarity = 1.0e-6
feasibility = 1.0e-6
relative_duality_gap = 1.0e-6
calibrated = true

[multinomial]
n_classes = 5
teacher_scale = 1.0
box_lower = -1.0
box_upper = 1.0
# Three points isolate sample scaling at p = 2^11; the last isolates
# feature scaling from the shared n = 2^16 anchor.
shapes = [
  { n = 16384, p = 2048 },
  { n = 65536, p = 2048 },
  { n = 262144, p = 2048 },
  { n = 65536, p = 8192 },
]

[multinomial.solvers]
cpu = ["rlaopt_sapphire", "projected_gradient", "jaxopt_lbfgsb"]
cuda = ["rlaopt_sapphire", "projected_gradient", "jaxopt_lbfgsb"]

[multinomial.execution]
max_iterations = 10000
batch_size = 256

[multinomial.execution.native_tolerances_calibrated]
cpu = true
cuda = true

[multinomial.execution.native_tolerances.cpu]
rlaopt_sapphire = 1.0e-7
projected_gradient = 1.0e-6
jaxopt_lbfgsb = 1.0e-6

[multinomial.execution.native_tolerances.cuda]
rlaopt_sapphire = 1.0e-7
projected_gradient = 1.0e-6
jaxopt_lbfgsb = 1.0e-6

[elastic_net]
teacher_density = 0.1
noise_ratio = 0.1
teacher_intercept = 0.5
# The pilot uses the less-regularized endpoint; production will restore both.
regularization_fractions = [0.01]
# The final shape adds a high-feature underdetermined stress case.
shapes = [
  { n = 16384, p = 2048 },
  { n = 65536, p = 2048 },
  { n = 262144, p = 2048 },
  { n = 65536, p = 8192 },
  { n = 8192, p = 16384 },
]

[elastic_net.vanilla_solvers]
cpu = ["rlaopt_sapphire", "sklearn_coordinate_descent", "jaxopt_proximal_gradient"]
cuda = ["rlaopt_sapphire", "cuml_coordinate_descent", "jaxopt_proximal_gradient"]

[elastic_net.vanilla_execution]
max_iterations = 10000
batch_size = 256

[elastic_net.vanilla_execution.native_tolerances_calibrated]
cpu = true
cuda = true

[elastic_net.vanilla_execution.native_tolerances.cpu]
rlaopt_sapphire = 1.0e-5
sklearn_coordinate_descent = 1.0e-4
jaxopt_proximal_gradient = 1.0e-5

[elastic_net.vanilla_execution.native_tolerances.cuda]
rlaopt_sapphire = 1.0e-5
cuml_coordinate_descent = 1.0e-4
jaxopt_proximal_gradient = 1.0e-5

[elastic_net.bounded_solvers]
cpu = ["rlaopt_admm", "scs", "clarabel_qdldl"]
cuda = ["rlaopt_admm", "scs_cuda", "cuclarabel_cudss"]

[elastic_net.bounded_execution]
max_iterations = 10000
batch_size = 256

[elastic_net.bounded_execution.native_tolerances_calibrated]
cpu = true
cuda = true

[elastic_net.bounded_execution.native_tolerances.cpu]
rlaopt_admm = 1.0e-7
scs = 1.0e-7
clarabel_qdldl = 1.0e-10

[elastic_net.bounded_execution.native_tolerances.cuda]
rlaopt_admm = 1.0e-7
scs_cuda = 1.0e-7
cuclarabel_cudss = 1.0e-10

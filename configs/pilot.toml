[experiment]
alphas = [0.5, 2.0]
lambdas = [0.01, 0.000001]
seeds = [0]
kkt_tolerance = 1.0e-6
timeout_seconds = 300
nystrom_rank = 128
warmups = 1
repetitions = 3

[[experiment.shapes]]
n = 256
p = 256
family = "square"
[[experiment.shapes]]
n = 4096
p = 4096
family = "square"
[[experiment.shapes]]
n = 16384
p = 4096
family = "fixed_p"
[[experiment.shapes]]
n = 262144
p = 1024
family = "fixed_n"

[backends.cpu]
solvers = ["rlaopt_nystrom_pcg", "rlaopt_cg", "scipy_lsqr", "torch_qr"]

[backends.cuda]
solvers = ["rlaopt_nystrom_pcg", "rlaopt_cg", "cuml_lsmr", "torch_qr"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rlaopt-experiments"
version = "0.1.0"
description = "Reproducible benchmarks for rlaopt"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "jax==0.11.1",
  "jaxopt==0.8.5",
  "matplotlib==3.11.1",
  # cuML 26.8.0's numba-cuda still imports np.row_stack, removed in NumPy 2.5.
  "numpy==2.4.2",
  "pandas==3.0.3",
  "pyarrow==23.0.1",
  "rlaopt==0.1.0",
  "scikit-learn==1.9.0",
  "scs==3.2.11",
  "scipy==1.18.1",
  "torch==2.13.0",
  "wandb==0.29.0",
]

[project.scripts]
rlaopt-bench = "rlaopt_experiments.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6"]
gpu = [
    "cuml-cu13==26.8.0",
    "cupy-cuda13x==14.2.0",
    "jax[cuda13]==0.11.1",
    "juliacall==0.9.31",
]

[tool.uv]
required-version = "==0.12.7"

[tool.hatch.build.targets.wheel]
packages = ["src/rlaopt_experiments"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
